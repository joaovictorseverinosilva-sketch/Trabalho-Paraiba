<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NotaVision</title>
    <style>
        :root {
            --primary: #4b5563;       /* Gray 600 */
            --primary-hover: #374151; /* Gray 700 */
            --bg-color: #f3f4f6;      /* Gray 100 */
            --card-bg: #ffffff;       /* White */
            --text-main: #111827;     /* Gray 900 */
            --border-color: #e5e7eb;  /* Gray 200 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }
        .brand {
            font-size: 24px;
            font-weight: 800;
            color: #1f2937;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #f9fafb;
            color: #1f2937;
            box-sizing: border-box;
        }
        input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        button:hover { background-color: var(--primary-hover); }
        .text-center { text-align: center; margin-top: 20px; }
        .text-center a { color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 500;}
        .text-center a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">NotaVision</div>
    <form action="/sistema/" method="GET" onsubmit="event.preventDefault(); localStorage.setItem('AUTH_TOKEN', 'mock-token-123'); window.location.href='/sistema/';">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit">Entrar no Sistema</button>
    </form>
    <div class="text-center">
        <a href="#">Ainda não tem conta? Cadastre-se</a>
    </div>
</div>

</body>
</html>
